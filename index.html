<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proctcher</title>
  <meta name="theme-color" content="#114b3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Proctcher">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <style>
    :root { --green: #114b3c; --muted: #64748b; --bg: #ffffff; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    #unused { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: var(--bg); }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); z-index: 2; transition: opacity 0.25s ease; padding: 24px; text-align: center; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 22px rgba(17, 75, 60, 0.18); }
    .name { font-weight: 900; font-size: 22px; color: var(--green); letter-spacing: 0.5px; }
    .msg { color: var(--muted); font-weight: 700; font-size: 15px; line-height: 1.6; max-width: 320px; }
    .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #d1e7dd; border-top-color: var(--green); animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    button { font: inherit; font-weight: 800; font-size: 16px; color: #ffffff; background: var(--green); border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
    .hidden { display: none !important; }
    .foot { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: #94a3b8; font-size: 12px; direction: ltr; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-512.png" alt="">
    <div class="name">PROCTCHER</div>
    <div id="spin" class="spin"></div>
    <div id="msg" class="msg">פותח את המערכת...</div>
    <button id="retry" type="button" class="hidden">לנסות שוב</button>
    <div class="foot">&copy; 2026 Gali Ben Natan. All rights reserved.</div>
  </div>
  <script>
    // ===== כתובת ה-Web App (מסתיימת ב-exec). אם יוצרים פריסה חדשה לגמרי, מעדכנים כאן. =====
    var APP_URL = "https://script.google.com/a/macros/shamir.school/s/AKfycbybpAzbHlx8yRmCRpJi8R-OHIM65lFcQYYKxMlgC19JvXfpjDNGKwm-9sJAiTM-o-l-/exec";

    // פותחים את המערכת ישירות (לא בתוך מסגרת), כך שההתחברות ל-Google והנתונים נשמרים כרגיל.
    // פרמטרים (למשל ?page=dashboard לקיצור הדרך של הרכזת) עוברים למערכת.
    function go() {
      var url = new URL(APP_URL);
      new URLSearchParams(location.search).forEach(function (v, k) { url.searchParams.set(k, v); });
      location.replace(url.toString());
    }
    document.getElementById('retry').addEventListener('click', go);
    setTimeout(function () {
      document.getElementById('spin').classList.add('hidden');
      document.getElementById('msg').textContent = 'המערכת לא נפתחה. יש לבדוק את החיבור לאינטרנט.';
      document.getElementById('retry').classList.remove('hidden');
    }, 12000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    setTimeout(go, 350);
  </script>
</body>
</html>
